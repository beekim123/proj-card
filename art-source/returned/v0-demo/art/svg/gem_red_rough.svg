<svg xmlns="http://www.w3.org/2000/svg" class="svg-gem_red_rough" viewBox="0 0 100 100" width="100" height="100">
<title>红宝石 · 原石</title>
<defs>
<linearGradient id="gem_red_rough-stone" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#6E6A63"/>
        <stop offset="60%" stop-color="#4A4742"/>
        <stop offset="100%" stop-color="#524531"/>
      </linearGradient>
</defs>
<g id="root">
<!-- 石皮底 -->
        <path d="M50,12 L69,16 L83,30 L88,50 L83,70 L69,84 L50,88 L31,84 L17,70 L12,50 L17,30 L31,16 Z" fill="url(#gem_red_rough-stone)"/>
        <!-- 背光暗部石皮 -->
        <path d="M83,30 L88,50 L83,70 L69,84 L50,88 L31,84 L48,62 L66,44 Z" fill="#2E2C28" opacity="0.78"/>
        <!-- 左上冷受光石边 -->
        <path d="M17,50 L17,30 L31,16 L50,12 L68,16" fill="none" stroke="#948F86" stroke-width="2.5" stroke-linecap="round"/>
        <!-- 裂隙露出的红宝石原矿（约38%面积，分主副两块晶簇） -->
        <polygon points="28,32 52,22 66,38 56,62 32,56 22,42" fill="#9E1424" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
        <polygon points="28,32 52,22 48,42 30,44" fill="#E3263A"/>
        <polygon points="36,30 48,26 44,36" fill="#FF5C6E" opacity="0.75"/>
        <polygon points="56,64 74,54 76,68 62,76 50,72" fill="#9E1424" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
        <polygon points="58,64 70,58 66,68" fill="#E3263A"/>
        <!-- 石皮裂纹与交叉排线 -->
        <path d="M52,22 L58,14 M66,38 L82,32 M32,56 L16,66 M56,62 L50,86 M68,74 L82,70" stroke="#1C1412" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <path d="M62,80 L76,66 M68,82 L82,68 M54,84 L68,70 M74,50 L84,40 M76,56 L86,46" stroke="#1C1412" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
        <!-- 外轮廓手绘线 -->
        <path d="M50,12 L69,16 L83,30 L88,50 L83,70 L69,84 L50,88 L31,84 L17,70 L12,50 L17,30 L31,16 Z" fill="none" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>
        <path d="M50,11.5 L69.5,16.5 L83.5,30.5 L88.5,50 L82.5,69.5 L68.5,84.5 L50,88.5 L30.5,83.5 L16.5,69.5 L11.5,50 L16.5,29.5 L31.5,15.5 Z" fill="none" stroke="#1C1412" stroke-width="1.6" stroke-linejoin="round" opacity="0.65"/>
</g>
</svg>
