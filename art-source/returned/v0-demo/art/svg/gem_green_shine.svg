<svg xmlns="http://www.w3.org/2000/svg" class="svg-gem_green_shine" viewBox="0 0 100 100" width="100" height="100">
<title>绿宝石 · 闪光</title>
<defs>
<linearGradient id="gem_green_shine-base" x1="15%" y1="10%" x2="85%" y2="90%">
        <stop offset="0%" stop-color="#5CE892"/>
        <stop offset="55%" stop-color="#1DBF5E"/>
        <stop offset="100%" stop-color="#117A3B"/>
      </linearGradient>
      <radialGradient id="gem_green_shine-halo" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#5CE892" stop-opacity="0.55"/>
        <stop offset="68%" stop-color="#1DBF5E" stop-opacity="0.22"/>
        <stop offset="100%" stop-color="#1DBF5E" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="gem_green_shine-inner" cx="42%" cy="38%" r="48%">
        <stop offset="0%" stop-color="#F0FFF7" stop-opacity="0.9"/>
        <stop offset="45%" stop-color="#5CE892" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#1DBF5E" stop-opacity="0"/>
      </radialGradient>
</defs>
<g id="root">
<circle cx="50" cy="50" r="48" fill="url(#gem_green_shine-halo)"/>
        <!-- 宝石底色 -->
        <path d="M22,14 L78,14 L86,22 L86,78 L78,86 L22,86 L14,78 L14,22 Z" fill="url(#gem_green_shine-base)"/>
        <!-- 外圈阶梯刻面（左上亮，右下暗） -->
        <polygon points="22,14 78,14 72,24 28,24" fill="#D4FFEA"/>
        <polygon points="14,22 22,14 28,24 24,28 24,72 14,78" fill="#5CE892"/>
        <polygon points="78,14 86,22 86,78 76,72 76,28 72,24" fill="#117A3B"/>
        <polygon points="24,72 28,76 72,76 76,72 86,78 78,86 22,86 14,78" fill="#094722"/>
        <!-- 二层阶梯刻面 -->
        <polygon points="28,24 72,24 65,33 35,33" fill="#5CE892"/>
        <polygon points="24,28 28,24 35,33 33,35 33,65 24,72" fill="#1DBF5E"/>
        <polygon points="72,24 76,28 76,72 67,65 67,35 65,33" fill="#117A3B"/>
        <polygon points="33,65 35,67 65,67 67,65 76,72 72,76 28,76 24,72" fill="#117A3B"/>
        <!-- 中央方形台面 -->
        <path d="M35,33 L65,33 L67,35 L67,65 L65,67 L35,67 L33,65 L33,35 Z" fill="#5CE892"/>
        <path d="M35,33 L65,33 L67,35 L67,65 L65,67 L35,67 L33,65 L33,35 Z" fill="url(#gem_green_shine-inner)"/>
        <!-- 阶梯刻面线 -->
        <path d="M28,24 L72,24 L76,28 L76,72 L72,76 L28,76 L24,72 L24,28 Z M35,33 L65,33 L67,35 L67,65 L65,67 L35,67 L33,65 L33,35 Z M22,14 L35,33 M78,14 L65,33 M86,22 L67,35 M86,78 L67,65 M78,86 L65,67 M22,86 L35,67 M14,78 L33,65 M14,22 L33,35" fill="none" stroke="#1C1412" stroke-width="1.5" stroke-linejoin="round"/>
        <!-- 台面高光 -->
        <polygon points="36,36 56,36 44,50 36,50" fill="#E6DEC8" opacity="0.92"/>
        <rect x="27" y="17" width="8" height="4" rx="1" fill="#FFFFFF" opacity="0.92"/>
        <!-- 手绘双层哥特外框 -->
        <path d="M22,14 L78,14 L86,22 L86,78 L78,86 L22,86 L14,78 L14,22 Z" fill="none" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>
        <path d="M21.5,13.6 L78.4,14.3 L86.4,22.3 L85.7,78.2 L77.7,86.4 L22.2,85.7 L13.6,77.7 L14.3,21.8 Z" fill="none" stroke="#1C1412" stroke-width="1.5" stroke-linejoin="round" opacity="0.65"/>
        <!-- 闪光态：内部亮斑与外围三颗四角星闪 -->
        <rect x="42" y="42" width="16" height="16" fill="#FFFFFF" opacity="0.5"/>
        <path d="M18,7 L21.2,14.8 L29,18 L21.2,21.2 L18,29 L14.8,21.2 L7,18 L14.8,14.8 Z" fill="#FFFFFF" stroke="#1C1412" stroke-width="1.2"/>
        <path d="M84,13 L86.6,19.4 L93,22 L86.6,24.6 L84,31 L81.4,24.6 L75,22 L81.4,19.4 Z" fill="#D4FFEA" stroke="#1C1412" stroke-width="1.1"/>
        <path d="M18,72.5 L20.2,77.8 L25.5,80 L20.2,82.2 L18,87.5 L15.8,82.2 L10.5,80 L15.8,77.8 Z" fill="#FFFFFF" stroke="#1C1412" stroke-width="1"/>
</g>
</svg>
