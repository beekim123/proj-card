<g transform="rotate(10 915 1853)"><use href="#hand" x="775" y="1433"/></g>
<text x="44" y="1384" font-size="20" fill="#9aa">G 手牌区 y1348 起 · 牌 280×420 · 6 张间距 150（8 张 107）</text>
<text x="540" y="1906" font-size="18" fill="#667" text-anchor="middle">按住的牌：抬高 80、放大 1.1、不转 · 松手时手指离开手牌区和按钮 = 打出</text>
