  <linearGradient id="oakShadow" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3a3b32" data-palette-stop-color="fall:1" />
    <stop offset="0.60" stop-color="#181c20" data-palette-stop-color="fall:0" />
