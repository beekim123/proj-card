    <stop offset="0" stop-color="#b3b2a1" stop-opacity="0.92" data-palette-stop-color="fall:3" />
    <stop offset="0.35" stop-color="#796950" data-palette-stop-color="fall:2" />
    <stop offset="1" stop-color="#3a3b32" data-palette-stop-color="fall:1" />
