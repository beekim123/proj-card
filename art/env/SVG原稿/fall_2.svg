  <path d="M44 19 Q45 11 54 6.8 Q62 11 64 19 M32 24.2 Q40 22.5 46 24.2" fill="none" stroke="#b3b2a1" stroke-width="1.35" stroke-linecap="round" opacity="0.86" data-palette-stroke="fall:3" />
</g>
