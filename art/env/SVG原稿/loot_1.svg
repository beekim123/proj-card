<svg xmlns="http://www.w3.org/2000/svg" width="264" height="316" viewBox="0 0 264 316" data-ground-anchor="0.5 1">
<defs>
  <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ffe4a8" stop-opacity="0.72" data-palette-stop-color="loot:3" />
    <stop offset="0.26" stop-color="#e2ad69" stop-opacity="0.44" data-palette-stop-color="loot:2" />
    <stop offset="0.54" stop-color="#e2ad69" stop-opacity="0.16" data-palette-stop-color="loot:2" />
    <stop offset="0.78" stop-color="#9b663e" stop-opacity="0.04" data-palette-stop-color="loot:1" />
    <stop offset="1" stop-color="#493023" stop-opacity="0" data-palette-stop-color="loot:0" />
  </radialGradient>
  <radialGradient id="spill" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#e2ad69" stop-opacity="0.26" data-palette-stop-color="loot:2" />
    <stop offset="0.38" stop-color="#9b663e" stop-opacity="0.12" data-palette-stop-color="loot:1" />
    <stop offset="1" stop-color="#493023" stop-opacity="0" data-palette-stop-color="loot:0" />
  </radialGradient>
  <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#493023" data-palette-stop-color="loot:0" />
    <stop offset="0.44" stop-color="#9b663e" data-palette-stop-color="loot:1" />
    <stop offset="0.82" stop-color="#493023" data-palette-stop-color="loot:0" />
    <stop offset="1" stop-color="#493023" data-palette-stop-color="loot:0" />
  </linearGradient>
  <linearGradient id="bevel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e2ad69" data-palette-stop-color="loot:2" />
    <stop offset="0.24" stop-color="#ffe4a8" data-palette-stop-color="loot:3" />
    <stop offset="0.52" stop-color="#9b663e" data-palette-stop-color="loot:1" />
    <stop offset="0.78" stop-color="#9b663e" data-palette-stop-color="loot:1" />
    <stop offset="1" stop-color="#e2ad69" data-palette-stop-color="loot:2" />
  </linearGradient>
  <clipPath id="outside">
    <path clip-rule="evenodd" d="M-40 -40H304V356H-40Z M82 62H182Q192 62 192 72V244Q192 254 182 254H82Q72 254 72 244V72Q72 62 82 62Z" transform="rotate(-8 132 158)" />
  </clipPath>
</defs>

<g id="base">
