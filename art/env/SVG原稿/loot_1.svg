    <ellipse cx="135" cy="268" rx="115" ry="44" fill="url(#spill)" opacity="0.78" />
    <!-- 环绕卡牌飘散的细微金色光尘 -->
    <path d="M52 108 l2.4 4.2 -2.4 4.2 -2.4 -4.2 Z M214 128 l2.0 3.5 -2.0 3.5 -2.0 -3.5 Z M62 224 l1.8 3.2 -1.8 3.2 -1.8 -3.2 Z" fill="#ffe4a8" opacity="0.72" data-palette-fill="loot:3" />
    <circle cx="204" cy="206" r="1.8" fill="#ffe4a8" opacity="0.62" data-palette-fill="loot:3" />
    <circle cx="46" cy="168" r="1.4" fill="#e2ad69" opacity="0.54" data-palette-fill="loot:2" />
    <circle cx="196" cy="78" r="1.5" fill="#ffe4a8" opacity="0.58" data-palette-fill="loot:3" />
  </g>
  <g transform="rotate(-8 132 158)" opacity="0.84">
    <!-- 卡框受光侧鎏金流光高光 -->
    <path d="M77 242 Q75.5 237 75.5 225 V76 Q75.5 66 85 65 H182" fill="none" stroke="#ffe4a8" stroke-width="1.75" stroke-linecap="round" data-palette-stroke="loot:3" />
    <path d="M181 249 H88 Q80 248 77 242" fill="none" stroke="#e2ad69" stroke-width="1.55" stroke-linecap="round" data-palette-stroke="loot:2" />
    <!-- 中心发光星核 -->
    <path d="M132 148 L139 158 L132 168 L125 158 Z" fill="#ffe4a8" opacity="0.78" data-palette-fill="loot:3" />
    <path d="M132 142 Q133 156 144 158 Q133 160 132 174 Q131 160 120 158 Q131 156 132 142 Z" fill="#ffe4a8" opacity="0.48" data-palette-fill="loot:3" />
  </g>
</g>
</svg>