    <path d="M95 85 l3.2 4.8 -3.2 4.8 -3.2 -4.8 Z M169 85 l3.2 4.8 -3.2 4.8 -3.2 -4.8 Z M95 221 l3.2 4.8 -3.2 4.8 -3.2 -4.8 Z M169 221 l3.2 4.8 -3.2 4.8 -3.2 -4.8 Z" fill="#e2ad69" opacity="0.78" data-palette-fill="loot:2" />
    <!-- 卡背中央神秘星阵纹章（对称双环 + 八芒星轨 + 菱眼核心） -->
    <path d="M132 90 Q158 112 170 158 Q158 204 132 226 Q106 204 94 158 Q106 112 132 90 Z" fill="none" stroke="#9b663e" stroke-width="1.5" data-palette-stroke="loot:1" />
    <path d="M132 98 Q152 118 162 158 Q152 198 132 218 Q112 198 102 158 Q112 118 132 98 Z" fill="none" stroke="#e2ad69" stroke-width="1.05" opacity="0.66" data-palette-stroke="loot:2" />
    <circle cx="132" cy="158" r="24" fill="none" stroke="#e2ad69" stroke-width="0.95" opacity="0.58" data-palette-stroke="loot:2" />
    <path d="M132 106 L132 128 M132 188 L132 210 M102 158 L114 158 M150 158 L162 158 M112 138 L120 146 M144 170 L152 178 M152 138 L144 146 M120 170 L112 178" fill="none" stroke="#e2ad69" stroke-width="0.95" stroke-linecap="round" opacity="0.60" data-palette-stroke="loot:2" />
    <!-- 中心宝石棱盾 -->
    <path d="M132 141 Q142 149 146 158 Q142 167 132 175 Q122 167 118 158 Q122 149 132 141 Z" fill="#9b663e" stroke="#e2ad69" stroke-width="1.15" data-palette-fill="loot:1" data-palette-stroke="loot:2" />
    <circle cx="132" cy="100" r="2.2" fill="#e2ad69" opacity="0.72" data-palette-fill="loot:2" />
    <circle cx="132" cy="216" r="2.2" fill="#e2ad69" opacity="0.72" data-palette-fill="loot:2" />
  </g>
</g>

<g id="sway">
