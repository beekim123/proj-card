    <rect x="72" y="62" width="120" height="192" rx="10" fill="url(#bevel)" />
    <rect x="77" y="67" width="110" height="182" rx="7" fill="url(#back)" />
    <!-- 双层细刻雕花内框 -->
    <rect x="82" y="72" width="100" height="172" rx="5" fill="none" stroke="#e2ad69" stroke-opacity="0.68" stroke-width="1.05" data-palette-stroke="loot:2" />
    <rect x="86" y="76" width="92" height="164" rx="3.5" fill="none" stroke="#9b663e" stroke-opacity="0.75" stroke-width="0.8" data-palette-stroke="loot:1" />
    <!-- 四角弧形卷草花饰 + 菱形铆钉 -->
